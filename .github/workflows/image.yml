name: Publication de l'image

# main → :latest (production), beta → :beta (pré-production). ADR-0005.
# Chaque image reçoit aussi :sha-<court> et :<version de package.json> (suffixée -beta sur beta) : ce sont les
# étiquettes vers lesquelles revenir en arrière.
on:
  push:
    branches: [main, beta]

# Lecture seule par défaut : seul le job de publication reçoit packages: write.
permissions:
  contents: read

# Un push plus récent sur la même branche annule la publication en cours.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Aucune image n'est publiée si la vérification échoue (cloisonnement compris).
  verifier:
    name: Vérification préalable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  publier:
    name: Construire et publier sur GHCR
    needs: verifier
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: etiquette
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "valeur=latest" >> "$GITHUB_OUTPUT"
            echo "version=${version}" >> "$GITHUB_OUTPUT"
          else
            # Suffixe : la bêta ne doit pas écraser l'étiquette de version de la production.
            echo "valeur=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "version=${version}-${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/lokyron/attroupe:${{ steps.etiquette.outputs.valeur }}
            ghcr.io/lokyron/attroupe:${{ steps.etiquette.outputs.sha }}
            ghcr.io/lokyron/attroupe:${{ steps.etiquette.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
